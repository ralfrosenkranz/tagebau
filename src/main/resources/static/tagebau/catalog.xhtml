<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="de" lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tagebau Shop • Katalog</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="catalog">
  <div class="hazard top"></div>
  <div class="hazard bottom"></div>

  <header class="header">
    <div class="container">
      <div class="row">
        <a class="brand" href="landing.xhtml">
          <img src="img/brand/logo-mark.svg" alt="Tagebau Heavy Machines" />
          <span>
            <span class="t1">Tagebau</span><br />
            <span class="t2">Heavy Machines</span>
          </span>
        </a>

        <nav class="nav" aria-label="Hauptnavigation">
          <a class="" href="landing.xhtml">Shop</a>
          <a class="active" href="catalog.xhtml">Katalog</a>
          <a class="" href="product.xhtml">Produkt</a>
          <a class="" href="cart.xhtml">Warenkorb</a>
        </nav>

        <div class="actions">
          <form class="search" action="catalog.xhtml" method="get">
            <img src="img/icons/ico-search-64.png" alt="" style="width:22px;height:22px;opacity:.9" />
            <input type="text" name="q" value="" placeholder="Bagger, Muldenkipper, Bohrgerät …" />
            <button class="btn hazard" type="submit">Suche</button>
          </form>

          <a class="cart" href="cart.xhtml" aria-label="Warenkorb">
            <img src="img/icons/ico-cart-64.png" alt="" style="width:22px;height:22px;opacity:.9" />
            <span class="label">Warenkorb</span>
            <span class="badge" id="cartCount">2</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      
<div class="content-head">
  <div>
    <div class="kicker">Katalog</div>
    <h1 style="margin-top:8px">Maschinen &amp; Fahrzeuge</h1>
    <div class="muted" style="font-size:13px">
      Schema: <span data-catalog-schema="true">–</span> • Stand: <span data-catalog-generated="true">–</span>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="muted">Sortieren:</span>
    <select class="compact" style="width:auto" id="sortSelect" aria-label="Sortierung">
      <option value="">Standard</option>
      <option value="nickname,asc">Name (A–Z)</option>
      <option value="nickname,desc">Name (Z–A)</option>
      <option value="pricing.priceExorbitant,asc">Preis (aufsteigend)</option>
      <option value="pricing.priceExorbitant,desc">Preis (absteigend)</option>
    </select>
  </div>
</div>

<div class="catalog">
  <aside class="panel catlist" id="categoryList">
    <div style="font-weight:900;padding-top:4px">Kategorien</div>
    <div id="categoryLinks"></div>
    <hr />

    <div class="muted" style="font-size:12px;margin-bottom:8px">Filter</div>

    <div style="display:grid;gap:8px">
      <label class="muted" style="font-size:12px">Zustand</label>
      <input class="compact" id="filterCondition" type="text" placeholder="z.B. neu, gebraucht" />

      <label class="muted" style="font-size:12px">Verfügbarkeit</label>
      <input class="compact" id="filterAvailability" type="text" placeholder="z.B. sofort, vorbestellbar" />

      <label class="muted" style="font-size:12px">Preis von</label>
      <input class="compact" id="filterMinPrice" type="number" min="0" step="1" placeholder="Min" />

      <label class="muted" style="font-size:12px">Preis bis</label>
      <input class="compact" id="filterMaxPrice" type="number" min="0" step="1" placeholder="Max" />

      <button class="btn hazard" id="filterApply" type="button">Anwenden</button>
    </div>
  </aside>

  <section class="panel prodlist" id="productList">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end">
      <div>
        <div style="font-weight:900">Produkte: <span data-category-name="true">–</span></div>
        <div class="muted" style="font-size:12px"><span data-products-count="true">–</span> Treffer</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center" data-paging="1">
        <span class="muted">Seite</span>
        <select class="compact" style="width:auto" id="pageSelect" aria-label="Seite">
          <option value="0" selected="selected">1</option>
        </select>

        <span class="muted">pro Seite</span>
        <select class="compact" style="width:auto" id="sizeSelect" aria-label="Seitengröße">
          <option value="12">12</option>
          <option value="24" selected="selected">24</option>
          <option value="48">48</option>
        </select>
      </div>
    </div>
  </section>
</div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="row">
        <div>
          <div style="font-weight:900">Tagebau Heavy Machines</div>
          <!--
          <div class="muted" style="font-size:12px">Static Demo • später via REST (OpenAPI) dynamisch füllen</div>
          -->
        </div>
        <div style="display:flex;gap:14px">
          <a href="#" onclick="return false;">Impressum</a>
          <a href="#" onclick="return false;">Datenschutz</a>
          <a href="#" onclick="return false;">Kontakt</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
